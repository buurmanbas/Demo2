<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Algemene voorwaarden | Buurman Bas</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        line-height: 1.6;
        color: #333;
        background-color: #fff;
    }

    header {
        background: #2b6777;
        color: white;
        text-align: center;
        padding: 20px;
    }

    .header-logo {
        display: block;
        width: 250px;
        height: auto;
        margin: 0 auto 20px auto;
    }

    header h1 {
        font-size: 2.5rem;
    }

    header p {
        font-size: 1.1rem;
    }

    section {
        max-width: 1000px;
        margin: auto;
        padding: 30px 20px;
    }

    h2 {
        color: #2b6777;
        margin-top: 25px;
        margin-bottom: 10px;
    }

    p {
        margin-bottom: 12px;
    }

    ul {
        margin-left: 25px;
        margin-bottom: 15px;
    }

    li {
        margin-bottom: 5px;
    }

    .intro {
        background: #f4f4f4;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 30px;
    }

    .button {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 24px;
        background: #25D366;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
    }

    .button:hover {
        opacity: 0.9;
    }

    footer {
        text-align: center;
        background: #2b6777;
        color: white;
        padding: 20px;
        margin-top: 30px;
    }

    footer a {
        color: #f4f4f4;
    }
</style>
</head>

<body>
